name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build browser-compatible site
        shell: python
        run: |
          from pathlib import Path
          import re, base64, gzip

          # Keep the existing completed site at the root URL exactly as before.
          src = Path("index.html").read_text(encoding="utf-8")
          m = re.search(r'atob\("([A-Za-z0-9+/=]+)"\)', src)
          if not m:
              raise SystemExit("Embedded game payload not found")

          broken = m.group(1)
          prefix = broken[:-4]
          tail = (
              Path("payload_tail_1.txt").read_text(encoding="utf-8").strip()
              + Path("payload_tail_2.txt").read_text(encoding="utf-8").strip()
              + Path("payload_tail_3.txt").read_text(encoding="utf-8").strip()
          )
          payload = prefix + tail
          if len(payload) != 50708:
              raise SystemExit(f"Unexpected payload length: {len(payload)}")

          html_bytes = gzip.decompress(base64.b64decode(payload))
          if len(html_bytes) != 133619:
              raise SystemExit(f"Unexpected HTML size: {len(html_bytes)}")

          out = Path("_site")
          out.mkdir(exist_ok=True)
          (out / "index.html").write_bytes(html_bytes)
          print("Built existing root site:", len(html_bytes), "bytes")

          # Build v3.7 independently under /v37/ so the existing site is not overwritten.
          v37_payload = "".join(
              Path(f"v37_payload_{i}.txt").read_text(encoding="utf-8").strip()
              for i in range(1, 7)
          )
          if len(v37_payload) != 53564:
              raise SystemExit(f"Unexpected v3.7 payload length: {len(v37_payload)}")

          v37_html = gzip.decompress(base64.b64decode(v37_payload))
          if len(v37_html) != 141011:
              raise SystemExit(f"Unexpected v3.7 HTML size: {len(v37_html)}")

          old_key = b"baseballCoachV1"
          new_key = b"baseballCoachV7"
          occurrences = v37_html.count(old_key)
          if occurrences != 3:
              raise SystemExit(f"Unexpected save-key occurrence count: {occurrences}")
          v37_html = v37_html.replace(old_key, new_key)

          v37_dir = out / "v37"
          v37_dir.mkdir(parents=True, exist_ok=True)
          (v37_dir / "index.html").write_bytes(v37_html)
          print("Built v3.7 site with isolated saves:", len(v37_html), "bytes")

          # Build v3.9 independently under /v39/. The root and /v37/ sites stay unchanged.
          v39_payload = "".join(
              Path(f"v39_payload_{i}.txt").read_text(encoding="utf-8").strip()
              for i in range(1, 8)
          )
          if len(v39_payload) != 54420:
              raise SystemExit(f"Unexpected v3.9 payload length: {len(v39_payload)}")

          v39_html = gzip.decompress(base64.b64decode(v39_payload))
          if len(v39_html) != 142659:
              raise SystemExit(f"Unexpected v3.9 HTML size: {len(v39_html)}")

          old_key = b"baseballCoachV1"
          new_key = b"baseballCoachV9"
          occurrences = v39_html.count(old_key)
          if occurrences != 3:
              raise SystemExit(f"Unexpected v3.9 save-key occurrence count: {occurrences}")
          v39_html = v39_html.replace(old_key, new_key)

          v39_dir = out / "v39"
          v39_dir.mkdir(parents=True, exist_ok=True)
          (v39_dir / "index.html").write_bytes(v39_html)
          print("Built v3.9 site with isolated saves:", len(v39_html), "bytes")

          # Build v3.12 independently under /happyleague/. Existing sites stay unchanged.
          v312_payload = "".join(
              Path(f"v312_payload_{i}.txt").read_text(encoding="utf-8").strip()
              for i in range(1, 8)
          )
          if len(v312_payload) != 56096:
              raise SystemExit(f"Unexpected v3.12 payload length: {len(v312_payload)}")

          v312_html = gzip.decompress(base64.b64decode(v312_payload))
          if len(v312_html) != 147196:
              raise SystemExit(f"Unexpected v3.12 HTML size: {len(v312_html)}")

          old_key = b"baseballCoachV1"
          new_key = b"baseballCoachV312"
          occurrences = v312_html.count(old_key)
          if occurrences != 3:
              raise SystemExit(f"Unexpected v3.12 save-key occurrence count: {occurrences}")
          v312_html = v312_html.replace(old_key, new_key)

          v312_dir = out / "happyleague"
          v312_dir.mkdir(parents=True, exist_ok=True)
          (v312_dir / "index.html").write_bytes(v312_html)
          print("Built v3.12 happyleague site with isolated saves:", len(v312_html), "bytes")

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
