name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inspect embedded payload
        shell: python
        run: |
          from pathlib import Path
          import re
          src = Path("index.html").read_text(encoding="utf-8")
          m = re.search(r'atob\("([A-Za-z0-9+/=]+)"\)', src)
          if not m:
              raise SystemExit("Embedded game payload not found")
          print("PAYLOAD_LENGTH=" + str(len(m.group(1))))
          print("PAYLOAD_END=" + m.group(1)[-80:])
          raise SystemExit("Inspection complete")
